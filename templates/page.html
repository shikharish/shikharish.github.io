{% extends "base.html" %}

{% block title %}{{ page.title }} — {{ config.title }}{% endblock title %}

{% block content %}
  <article class="article">
    <h1>{{ page.title }}</h1>
    {% if page.date %}
      <p><time datetime="{{ page.date }}">{{ page.date | date(format="%m/%d/%Y") }}</time></p>
    {% endif %}

    <div class="prose">
      {{ page.content | safe }}
    </div>
  </article>
{% endblock content %}
