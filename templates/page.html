{% extends "base.html" %}

{% block title %}{{ page.title }} — {{ config.title }}{% endblock title %}

{% block content %}
  <article class="article">
    <header class="page-header article-header">
      {% if page.date %}
        <p class="eyebrow"><time datetime="{{ page.date }}">{{ page.date | date(format="%B %Y") }}</time></p>
      {% endif %}
      <h1>{{ page.title }}</h1>
    </header>

    <div class="prose">
      {{ page.content | safe }}
    </div>
  </article>
{% endblock content %}
