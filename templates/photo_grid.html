{% extends "base.html" %}

{% block title %}{{ section.title }} — {{ config.title }}{% endblock title %}

{% block content %}
  <h1>{{ section.title }}</h1>

  <div class="gallery-grid">
    {% for asset in section.assets %}
      <figure class="gallery-item">
        <img src="{{ get_url(path=asset) }}" alt="Photograph {{ loop.index }}" loading="lazy">
      </figure>
    {% endfor %}
  </div>
{% endblock content %}
